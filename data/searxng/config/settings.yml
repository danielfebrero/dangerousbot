use_default_settings: true

general:
  debug: false
  instance_name: "SearxNG Local"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "dangerousbot_secret_key_2024"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
    - csv
    - rss

ui:
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
